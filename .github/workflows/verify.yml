name: Static validation
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Adapter determinism
        run: python tools/build_adapters.py --check
      - name: Public-source preflight
        run: python tools/scan_public_release.py
